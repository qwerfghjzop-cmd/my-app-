<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Tasks - 과제 관리</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap");

    :root {
      --bg: #2d1553;
      --card: #3c1f66;
      --card-2: #4d2a7f;
      --muted: #d5c6f0;
      --text: #fffaf0;
      --accent: #ffd84f;
      --accent-2: #f8c52b;
      --danger: #ff8ca2;
      --ok: #88e7c4;
      --warn: #ffe07f;
      --line: #6f4aa8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Nunito", "Noto Sans KR", sans-serif;
      background-image:
        linear-gradient(rgba(20, 6, 37, .45), rgba(20, 6, 37, .45)),
        radial-gradient(circle at 15% 10%, #6f3fb1 0%, transparent 28%),
        radial-gradient(circle at 90% 12%, #f0db63 0%, transparent 20%),
        linear-gradient(160deg, #2a114e, #3a1867 45%, #2a124e);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(1000px, 92vw);
      margin: 2rem auto 3rem;
    }

    .title {
      margin: 0 0 .35rem;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 1.2rem;
      color: var(--muted);
      font-size: .95rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    .card {
      background: linear-gradient(165deg, color-mix(in oklab, var(--card), black 6%), color-mix(in oklab, var(--card-2), black 4%));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 10px 28px rgba(13, 2, 33, .45);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(13, 2, 33, .5);
      border-color: #8f67cb;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .7rem;
    }

    input, select, button, textarea {
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: .65rem .75rem;
      background: color-mix(in oklab, #2f1453, black 12%);
      color: var(--text);
      font-size: .92rem;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
      max-height: 180px;
    }

    input::placeholder, textarea::placeholder { color: #7380aa; }
    input:focus, select:focus, button:focus, textarea:focus {
      outline: 2px solid color-mix(in oklab, var(--accent), white 15%);
      outline-offset: 1px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(180deg, #ffd95a, #efbe2c);
      border-color: #d8a720;
      color: #3a175f;
      font-weight: 700;
      transition: .2s ease;
    }

    button:hover { filter: brightness(1.06); transform: translateY(-2px) scale(1.01); }

    .full { grid-column: span 2; }
    .full-row { grid-column: 1 / -1; }
    .actions {
      display: flex;
      gap: .6rem;
      align-items: end;
    }

    .progress-value-label {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      align-self: end;
      padding-bottom: .15rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr .85fr .85fr .85fr auto;
      gap: .7rem;
      align-items: center;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) auto auto;
      gap: .7rem;
      align-items: end;
    }

    .category-row label {
      display: block;
      margin-bottom: .25rem;
      font-size: .82rem;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: 1fr 170px 170px auto;
      gap: .7rem;
      align-items: end;
    }

    .progress-list {
      margin: .8rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .7rem;
    }

    .progress-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in oklab, #2b0f4f, black 8%);
      padding: .8rem;
      display: grid;
      gap: .55rem;
      justify-items: center;
    }

    .progress-text {
      display: grid;
      gap: .25rem;
      color: #d6ddf5;
      font-size: .86rem;
      line-height: 1.4;
      text-align: center;
    }

    .progress-ring {
      --pct: 0;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #2e1453 58%, transparent 59%),
        conic-gradient(#8cf0d0 calc(var(--pct) * 1%), #563683 0);
      border: 1px solid #7b57ae;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, .35);
      font-weight: 800;
      color: #fff5d7;
    }

    .task-list, .subtask-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: .6rem;
    }

    .task {
      border: 1px solid var(--line);
      background: color-mix(in oklab, #32165a, black 8%);
      border-radius: 12px;
      padding: .8rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: .75rem;
      align-items: start;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .task:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(10, 2, 28, .35);
    }

    .task.done {
      opacity: .65;
      background: color-mix(in oklab, #254f48, #2e1453 55%);
      border-color: #3fa090;
    }

    .task-main {
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      color: var(--muted);
      font-size: .82rem;
    }

    .task-note {
      margin: .2rem 0 0;
      color: #f2dfff;
      font-size: .88rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tag {
      border: 1px solid var(--line);
      padding: .2rem .45rem;
      border-radius: 999px;
      background: color-mix(in oklab, #2d1350, black 5%);
    }

    .tag.high { border-color: #f29db5; color: #ffd2de; }
    .tag.medium { border-color: #d8b04d; color: #ffe9aa; }
    .tag.low { border-color: #6bc3aa; color: #c9f6e6; }

    .task-actions {
      display: flex;
      gap: .45rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .task-children {
      grid-column: 2 / -1;
      display: grid;
      gap: .75rem;
    }

    .subtask-list {
      margin-top: .15rem;
      padding-left: 1rem;
      border-left: 1px dashed color-mix(in oklab, var(--line), white 10%);
    }

    .subtask-form {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
      padding: .7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in oklab, #2a114b, black 2%);
    }

    .subtask-form textarea {
      min-height: 56px;
    }

    .subtask-actions {
      display: flex;
      justify-content: flex-end;
      gap: .45rem;
    }

    .ghost {
      background: color-mix(in oklab, #3a1a63, black 4%);
      color: #ffefb4;
      border-color: #a67bd8;
    }
    .danger {
      background: linear-gradient(180deg, #ff9aae, #ef6f90);
      border-color: #da4e76;
      color: #410825;
    }
    .muted { color: var(--muted); }

    .quick-menu-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      gap: 1.25rem;
      align-items: start;
    }

    .quick-menu-main h2 {
      margin: 0 0 .5rem;
    }

    .quick-menu-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .65rem;
    }

    .quick-menu-tabs button {
      flex: 1;
      min-width: 7rem;
      padding: .55rem .75rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: color-mix(in oklab, #2b0f4f, black 6%);
      color: #ffefb4;
      font-size: .9rem;
      font-weight: 700;
      transition: .18s ease;
    }

    .quick-menu-tabs button:hover {
      border-color: #8f67cb;
      background: color-mix(in oklab, #3a1a63, white 4%);
      transform: translateY(-1px);
    }

    .quick-menu-tabs button.active {
      background: linear-gradient(180deg, #ffd95a, #efbe2c);
      border-color: #d8a720;
      color: #3a175f;
      outline: 2px solid rgba(255, 240, 170, .45);
    }

    .app-tab-panel.hidden {
      display: none;
    }

    .list-section-block {
      display: grid;
      gap: 1rem;
    }

    .list-section-block h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    .quick-menu-urgent {
      border-left: 1px solid color-mix(in oklab, var(--line), white 8%);
      padding-left: 1.25rem;
      min-width: 0;
    }

    .quick-menu-urgent h3 {
      margin: 0 0 .65rem;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }

    .urgent-due-subtitle {
      margin: 0 0 .75rem;
      font-size: .86rem;
      line-height: 1.45;
    }

    .urgent-due-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: .55rem;
    }

    .urgent-due-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .75rem .9rem;
      background: color-mix(in oklab, #2b0f4f, black 6%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .urgent-due-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      flex: 1;
      min-width: 0;
    }

    .urgent-due-badge {
      flex-shrink: 0;
      padding: .35rem .6rem;
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--warn), white 20%);
      background: color-mix(in oklab, #3a1a63, black 5%);
      color: var(--warn);
      font-size: .88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .urgent-due-badge.overdue {
      border-color: color-mix(in oklab, var(--danger), white 15%);
      color: #ffd2de;
      background: color-mix(in oklab, #4a1a35, #2b0f4f 60%);
    }

    .urgent-due-empty {
      margin: 0;
      padding: .85rem 1rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
    }

    .auth-card {
      border: 1px solid #8f67cb;
      background: linear-gradient(165deg, #4a2678, #3a1c64);
    }

    .auth-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .65rem;
      align-items: end;
    }

    .auth-actions {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .google-btn {
      background: linear-gradient(180deg, #fff6c7, #ffd95a);
      color: #3a175f;
      border-color: #e2bc45;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .6rem;
      border-radius: 999px;
      border: 1px solid #9b7ecb;
      background: color-mix(in oklab, #301553, black 5%);
      color: #ffe9a9;
      font-size: .82rem;
      margin-top: .6rem;
    }

    .toggle-panel.hidden {
      display: none;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task, .progress-item, .urgent-due-item {
      animation: fadeInUp .25s ease both;
    }


    .empty {
      text-align: center;
      color: var(--muted);
      padding: 1rem .4rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    @media (max-width: 900px) {
      .input-grid { grid-template-columns: 1fr 1fr; }
      .auth-grid { grid-template-columns: 1fr 1fr; }
      .full { grid-column: span 2; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .category-row { grid-template-columns: 1fr; }
      .progress-grid { grid-template-columns: 1fr 1fr; }
      .quick-menu-layout { grid-template-columns: 1fr; }
      .quick-menu-urgent {
        border-left: none;
        padding-left: 0;
        padding-top: 1rem;
        border-top: 1px solid color-mix(in oklab, var(--line), white 8%);
      }
    }

    @media (max-width: 620px) {
      .task { grid-template-columns: auto 1fr; }
      .task-actions { grid-column: 1 / -1; justify-content: end; }
      .task-children { grid-column: 1 / -1; }
      .subtask-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container grid">
    <section>
      <h1 class="title">Campus Tasks</h1>
      <p class="subtitle">대학생을 위한 과제 관리 앱 · 브라우저 로컬 저장소에 자동 저장됩니다.</p>
    </section>

    <section class="card">
      <div class="quick-menu-layout">
        <div class="quick-menu-main">
          <h2>빠른 메뉴</h2>
          <div class="quick-menu-tabs" role="tablist" aria-label="빠른 메뉴">
            <button id="tabAddBtn" type="button" role="tab" aria-selected="true" data-tab="add" class="active">과제 추가</button>
            <button id="tabListBtn" type="button" role="tab" aria-selected="false" data-tab="list">과제 리스트</button>
          </div>
        </div>
        <div class="quick-menu-urgent">
          <h3>마감 3일 이내</h3>
          <div id="urgentDueSummary"></div>
        </div>
      </div>
    </section>

    <section id="loginPanel" class="card auth-card toggle-panel hidden" style="display:none;">
      <h2>로그인</h2>
      <div class="auth-grid">
        <input id="emailInput" type="email" placeholder="이메일">
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자 이상)">
        <div class="auth-actions full">
          <button id="loginBtn" type="button">이메일 로그인</button>
          <button id="signupBtn" class="ghost" type="button">이메일 회원가입</button>
          <button id="googleLoginBtn" class="google-btn" type="button">Google 로그인</button>
          <button id="logoutBtn" class="danger" type="button">로그아웃</button>
        </div>
      </div>
      <p id="authMessage" class="status-chip">로컬 저장 모드가 활성화되었습니다.</p>
    </section>

    <div id="appContent" class="grid">
    <div id="appTabAdd" class="app-tab-panel">
      <section class="card">
        <h2>과제 추가</h2>
        <p class="muted" style="margin: 0 0 .75rem; font-size: .86rem; line-height: 1.45;">수업 이름 카테고리를 선택하거나 새로 추가한 뒤, 해당 수업에 맞는 과제를 작성하세요.</p>
        <div class="input-grid">
          <div class="full-row category-row">
            <div>
              <label for="courseCategorySelect" class="muted">작성할 수업</label>
              <select id="courseCategorySelect"></select>
            </div>
            <div>
              <label for="newCourseCategoryInput" class="muted">새 수업 이름</label>
              <input id="newCourseCategoryInput" type="text" placeholder="예: 자료구조, 영어회화">
            </div>
            <button id="addCourseCategoryBtn" type="button">수업 추가</button>
            <button id="removeCourseCategoryBtn" type="button" class="ghost">선택 수업 삭제</button>
          </div>
          <input id="titleInput" class="full" type="text" placeholder="과제명 (예: 4주차 보고서)">
          <input id="dueInput" type="date">
          <select id="priorityInput">
            <option value="high">우선순위: 높음</option>
            <option value="medium" selected>우선순위: 보통</option>
            <option value="low">우선순위: 낮음</option>
          </select>
          <div class="actions">
            <button id="addBtn" type="button">추가</button>
          </div>
          <textarea id="noteInput" class="full-row" placeholder="세부 참고 사항 메모 (예: 교수님 코멘트, 참고 링크, 제출 형식)"></textarea>
        </div>
      </section>
    </div>

    <div id="appTabList" class="app-tab-panel hidden">
      <section class="card grid">
        <h2>과제 리스트</h2>
        <div class="list-section-block">
          <h3>과제 진행도</h3>
          <div class="progress-grid">
            <select id="progressTaskInput">
              <option value="">진행도 업데이트할 과제 선택</option>
            </select>
            <input id="progressValueInput" type="range" min="0" max="100" step="5" value="0">
            <div id="progressValueLabel" class="progress-value-label">0%</div>
            <button id="saveProgressBtn" type="button">진행도 저장</button>
          </div>
          <ul id="progressList" class="progress-list"></ul>
        </div>
        <div class="list-section-block">
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="과제명/수업명 검색">
            <select id="courseFilter">
              <option value="all">수업: 전체</option>
            </select>
            <select id="statusFilter">
              <option value="all">상태: 전체</option>
              <option value="active">상태: 진행 중</option>
              <option value="done">상태: 완료</option>
            </select>
            <select id="sortBy">
              <option value="due">정렬: 마감일 빠른 순</option>
              <option value="priority">정렬: 우선순위 높은 순</option>
              <option value="created">정렬: 최신 추가 순</option>
            </select>
            <button id="clearDoneBtn" class="ghost" type="button">완료 항목 삭제</button>
            <span id="countText" class="muted">0개 표시</span>
          </div>
          <ul id="taskList" class="task-list"></ul>
        </div>
      </section>
    </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY_BASE = "campus_tasks_v1";
    const COURSES_KEY_BASE = "campus_course_categories_v1";
    const PRIORITY_SCORE = { high: 3, medium: 2, low: 1 };
    const PRIORITY_LABEL = { high: "높음", medium: "보통", low: "낮음" };
    const SUBTASK_FORM_HTML = `
      <input data-field="title" class="full" type="text" placeholder="세부 과제명">
      <input data-field="course" type="text" placeholder="수업명 (비우면 상위와 동일)">
      <input data-field="dueDate" type="date">
      <select data-field="priority">
        <option value="high">우선순위: 높음</option>
        <option value="medium" selected>우선순위: 보통</option>
        <option value="low">우선순위: 낮음</option>
      </select>
      <textarea data-field="note" class="full-row" placeholder="세부 메모"></textarea>
      <div class="subtask-actions full-row">
        <button type="button" class="ghost" data-action="cancel-subtask">취소</button>
        <button type="button" data-action="save-subtask">세부 과제 추가</button>
      </div>
    `;

    const els = {
      appContent: document.getElementById("appContent"),
      tabAddBtn: document.getElementById("tabAddBtn"),
      tabListBtn: document.getElementById("tabListBtn"),
      appTabAdd: document.getElementById("appTabAdd"),
      appTabList: document.getElementById("appTabList"),
      loginPanel: document.getElementById("loginPanel"),
      toggleLoginPanelBtn: document.getElementById("toggleLoginPanelBtn"),
      urgentDueSummary: document.getElementById("urgentDueSummary"),
      emailInput: document.getElementById("emailInput"),
      passwordInput: document.getElementById("passwordInput"),
      loginBtn: document.getElementById("loginBtn"),
      signupBtn: document.getElementById("signupBtn"),
      googleLoginBtn: document.getElementById("googleLoginBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      authMessage: document.getElementById("authMessage"),
      titleInput: document.getElementById("titleInput"),
      courseCategorySelect: document.getElementById("courseCategorySelect"),
      newCourseCategoryInput: document.getElementById("newCourseCategoryInput"),
      addCourseCategoryBtn: document.getElementById("addCourseCategoryBtn"),
      removeCourseCategoryBtn: document.getElementById("removeCourseCategoryBtn"),
      dueInput: document.getElementById("dueInput"),
      priorityInput: document.getElementById("priorityInput"),
      noteInput: document.getElementById("noteInput"),
      progressTaskInput: document.getElementById("progressTaskInput"),
      progressValueInput: document.getElementById("progressValueInput"),
      progressValueLabel: document.getElementById("progressValueLabel"),
      saveProgressBtn: document.getElementById("saveProgressBtn"),
      progressList: document.getElementById("progressList"),
      addBtn: document.getElementById("addBtn"),
      clearDoneBtn: document.getElementById("clearDoneBtn"),
      searchInput: document.getElementById("searchInput"),
      courseFilter: document.getElementById("courseFilter"),
      statusFilter: document.getElementById("statusFilter"),
      sortBy: document.getElementById("sortBy"),
      taskList: document.getElementById("taskList"),
      countText: document.getElementById("countText")
    };

    let currentUid = "local";
    let tasks = [];
    let courseCategories = [];
    let activeSubtaskParentId = null;
    let activeAppTab = "add";

    function scopedKey(base, uid = currentUid) {
      return `${base}_${uid || "guest"}`;
    }

    function setAuthMessage(message) {
      els.authMessage.textContent = message;
    }

    function updateAppInteractivity() {
      els.appContent.style.opacity = "1";
      els.appContent.style.pointerEvents = "auto";
    }

    function requireAuth() {
      return true;
    }

    function switchAppTab(tab) {
      activeAppTab = tab === "list" ? "list" : "add";
      const isAdd = activeAppTab === "add";
      if (els.appTabAdd) els.appTabAdd.classList.toggle("hidden", !isAdd);
      if (els.appTabList) els.appTabList.classList.toggle("hidden", isAdd);
      if (els.tabAddBtn) {
        els.tabAddBtn.classList.toggle("active", isAdd);
        els.tabAddBtn.setAttribute("aria-selected", isAdd ? "true" : "false");
      }
      if (els.tabListBtn) {
        els.tabListBtn.classList.toggle("active", !isAdd);
        els.tabListBtn.setAttribute("aria-selected", !isAdd ? "true" : "false");
      }
    }

    function loadListFromStorage(base, uid = currentUid) {
      try {
        const raw = localStorage.getItem(scopedKey(base, uid));
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function createTask(input = {}) {
      return {
        id: input.id || crypto.randomUUID(),
        title: String(input.title || "").trim(),
        course: String(input.course || "").trim() || "과목 미지정",
        dueDate: input.dueDate || "",
        priority: PRIORITY_SCORE[input.priority] ? input.priority : "medium",
        note: String(input.note || "").trim(),
        done: Boolean(input.done),
        progress: Math.max(0, Math.min(100, Number(input.progress) || 0)),
        createdAt: Number(input.createdAt) || Date.now(),
        subtasks: normalizeTasks(input.subtasks || [])
      };
    }

    function normalizeTask(task = {}) {
      return createTask(task);
    }

    function normalizeTasks(list = []) {
      return Array.isArray(list) ? list.map(normalizeTask).filter(task => task.title) : [];
    }

    function loadTasks() {
      return normalizeTasks(loadListFromStorage(STORAGE_KEY_BASE));
    }

    function normalizeCourseNames(list = []) {
      if (!Array.isArray(list)) return [];
      return Array.from(new Set(
        list.map(v => String(v || "").trim()).filter(Boolean)
      )).sort((a, b) => a.localeCompare(b, "ko"));
    }

    function loadCourseCategories() {
      return normalizeCourseNames(loadListFromStorage(COURSES_KEY_BASE));
    }

    function saveCourseCategories() {
      localStorage.setItem(scopedKey(COURSES_KEY_BASE), JSON.stringify(courseCategories));
    }

    function collectCoursesFromTaskTree(list, set) {
      for (const task of list) {
        const c = String(task.course || "").trim();
        if (c && c !== "과목 미지정") set.add(c);
        collectCoursesFromTaskTree(task.subtasks || [], set);
      }
    }

    function migrateCourseCategoriesIfEmpty() {
      if (courseCategories.length) return;
      const set = new Set();
      collectCoursesFromTaskTree(tasks, set);
      courseCategories = Array.from(set).sort((a, b) => a.localeCompare(b, "ko"));
      if (courseCategories.length) saveCourseCategories();
    }

    function syncRemoteState() {
      // 로컬 저장 전용 모드
    }

    function saveTasks() {
      localStorage.setItem(scopedKey(STORAGE_KEY_BASE), JSON.stringify(tasks));
    }

    function mergeById(...lists) {
      const map = new Map();
      for (const list of lists) {
        for (const item of list) {
          const prev = map.get(item.id);
          if (!prev || (item.createdAt || 0) >= (prev.createdAt || 0)) {
            map.set(item.id, item);
          }
        }
      }
      return Array.from(map.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

    function detachUserStateListener() {}

    function attachUserStateListener() {
      return Promise.resolve();
    }

    function flattenTasks(list = tasks, depth = 0, parentPath = []) {
      return list.flatMap(task => {
        const titlePath = [...parentPath, task.title];
        return [
          { ...task, depth, titlePath },
          ...flattenTasks(task.subtasks || [], depth + 1, titlePath)
        ];
      });
    }

    function countTaskTree(list) {
      return list.reduce((sum, task) => sum + 1 + countTaskTree(task.subtasks || []), 0);
    }

    function mapTaskTree(list, id, updater) {
      return list.map(task => {
        if (task.id === id) {
          return updater(task);
        }
        if (task.subtasks?.length) {
          return { ...task, subtasks: mapTaskTree(task.subtasks, id, updater) };
        }
        return task;
      });
    }

    function removeTaskTree(list, id) {
      return list
        .filter(task => task.id !== id)
        .map(task => ({
          ...task,
          subtasks: removeTaskTree(task.subtasks || [], id)
        }));
    }

    function markAllDone(list, done) {
      return list.map(task => ({
        ...task,
        done,
        progress: done ? 100 : task.progress,
        subtasks: markAllDone(task.subtasks || [], done)
      }));
    }

    function mapToggleTask(list, id, nextDone) {
      return list.map(task => {
        if (task.id === id) {
          return {
            ...task,
            done: nextDone,
            progress: nextDone ? 100 : task.progress,
            subtasks: markAllDone(task.subtasks || [], nextDone)
          };
        }
        if (task.subtasks?.length) {
          return { ...task, subtasks: mapToggleTask(task.subtasks, id, nextDone) };
        }
        return task;
      });
    }

    function clearDoneTaskTree(list) {
      return list
        .filter(task => !task.done)
        .map(task => ({
          ...task,
          subtasks: clearDoneTaskTree(task.subtasks || [])
        }));
    }

    function filterTaskTree(list, predicate) {
      const result = [];
      for (const task of list) {
        const children = filterTaskTree(task.subtasks || [], predicate);
        if (predicate(task) || children.length) {
          result.push({ ...task, subtasks: children });
        }
      }
      return result;
    }

    function compareTasks(a, b, sortBy) {
      if (sortBy === "priority") {
        const p = PRIORITY_SCORE[b.priority] - PRIORITY_SCORE[a.priority];
        return p !== 0 ? p : a.createdAt - b.createdAt;
      }
      if (sortBy === "created") return b.createdAt - a.createdAt;

      const aDue = a.dueDate ? new Date(a.dueDate + "T00:00:00").getTime() : Number.POSITIVE_INFINITY;
      const bDue = b.dueDate ? new Date(b.dueDate + "T00:00:00").getTime() : Number.POSITIVE_INFINITY;
      if (aDue !== bDue) return aDue - bDue;
      return b.createdAt - a.createdAt;
    }

    function sortTaskTree(list, sortBy) {
      const sorted = [...list].map(task => ({
        ...task,
        subtasks: sortTaskTree(task.subtasks || [], sortBy)
      }));
      sorted.sort((a, b) => compareTasks(a, b, sortBy));
      return sorted;
    }

    function collectTaskIds(task) {
      return [task.id, ...(task.subtasks || []).flatMap(collectTaskIds)];
    }

    function formatDue(dateStr) {
      if (!dateStr) return "마감일 없음";
      const date = new Date(dateStr + "T00:00:00");
      if (Number.isNaN(date.getTime())) return "마감일 없음";
      return date.toLocaleDateString("ko-KR", { year: "numeric", month: "short", day: "numeric" });
    }

    function daysLeft(dateStr) {
      if (!dateStr) return null;
      const due = new Date(dateStr + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (Number.isNaN(due.getTime())) return null;
      return Math.floor((due - today) / (1000 * 60 * 60 * 24));
    }

    function dueBadge(task) {
      const left = daysLeft(task.dueDate);
      if (left === null) return "마감일 미정";
      if (left < 0) return `마감 지남 ${Math.abs(left)}일`;
      if (left === 0) return "오늘 마감";
      return `${left}일 남음`;
    }

    function getUrgentDueTasks() {
      return flattenTasks()
        .filter(task => !task.done)
        .filter(task => {
          const left = daysLeft(task.dueDate);
          return left !== null && left <= 3;
        })
        .sort((a, b) => {
          const leftA = daysLeft(a.dueDate);
          const leftB = daysLeft(b.dueDate);
          if (leftA !== leftB) return leftA - leftB;
          return PRIORITY_SCORE[b.priority] - PRIORITY_SCORE[a.priority];
        });
    }

    function renderUrgentDueSummary() {
      if (!els.urgentDueSummary) return;
      const urgent = getUrgentDueTasks();
      if (!urgent.length) {
        els.urgentDueSummary.innerHTML = '<p class="urgent-due-empty">3일 이내 마감 예정인 과제가 없습니다.</p>';
        return;
      }
      const items = urgent.map(task => {
        const left = daysLeft(task.dueDate);
        const overdue = left !== null && left < 0;
        return `
        <li class="urgent-due-item">
          <span class="urgent-due-title">${escapeHtml(task.titlePath.join(" > "))}</span>
          <span class="urgent-due-badge${overdue ? " overdue" : ""}">${escapeHtml(dueBadge(task))}</span>
        </li>
      `;
      }).join("");
      els.urgentDueSummary.innerHTML = `<ul class="urgent-due-list">${items}</ul>`;
    }

    function clearInputs() {
      els.titleInput.value = "";
      els.dueInput.value = "";
      els.priorityInput.value = "medium";
      els.noteInput.value = "";
      els.titleInput.focus();
    }

    function clearStudyLogInputs() {
      if (!els.progressTaskInput || !els.progressValueInput || !els.progressValueLabel) return;
      els.progressTaskInput.value = "";
      els.progressValueInput.value = "0";
      els.progressValueLabel.textContent = "0%";
    }

    function addCourseCategory() {
      if (!els.newCourseCategoryInput) return;
      const name = els.newCourseCategoryInput.value.trim();
      if (!name) {
        alert("추가할 수업 이름을 입력해주세요.");
        els.newCourseCategoryInput.focus();
        return;
      }
      if (courseCategories.includes(name)) {
        alert("이미 같은 이름의 수업이 있습니다.");
        return;
      }
      courseCategories = [...courseCategories, name].sort((a, b) => a.localeCompare(b, "ko"));
      saveCourseCategories();
      els.newCourseCategoryInput.value = "";
      if (els.courseCategorySelect) els.courseCategorySelect.value = name;
      render();
    }

    function removeSelectedCourseCategory() {
      if (!els.courseCategorySelect) return;
      const name = els.courseCategorySelect.value.trim();
      if (!name) {
        alert("목록에서 삭제할 수업을 선택하세요.");
        return;
      }
      if (!confirm(`「${name}」을(를) 수업 목록에서 삭제할까요?\n(이미 등록된 과제의 수업명은 바뀌지 않습니다)`)) return;
      courseCategories = courseCategories.filter(c => c !== name);
      saveCourseCategories();
      els.courseCategorySelect.value = "";
      render();
    }

    function addTask() {
      if (!requireAuth()) return;
      const title = els.titleInput.value.trim();
      const course = els.courseCategorySelect ? els.courseCategorySelect.value.trim() : "";
      const dueDate = els.dueInput.value;
      const priority = els.priorityInput.value;
      const note = els.noteInput.value.trim();

      if (!course) {
        alert("먼저 작성할 수업(카테고리)을 선택하거나, 위에서 새 수업을 추가해주세요.");
        if (els.courseCategorySelect) els.courseCategorySelect.focus();
        return;
      }

      if (!title) {
        alert("과제명을 입력해주세요.");
        els.titleInput.focus();
        return;
      }

      tasks.unshift(createTask({ title, course, dueDate, priority, note }));
      saveTasks();
      clearInputs();
      switchAppTab("list");
      render();
    }

    function addSubtask(parentId, values) {
      const title = values.title.trim();
      if (!title) {
        alert("세부 과제명을 입력해주세요.");
        return false;
      }

      tasks = mapTaskTree(tasks, parentId, (task) => ({
        ...task,
        subtasks: [
          createTask({
            title,
            course: values.course.trim() || task.course,
            dueDate: values.dueDate,
            priority: values.priority,
            note: values.note.trim()
          }),
          ...(task.subtasks || [])
        ]
      }));

      activeSubtaskParentId = null;
      saveTasks();
      render();
      return true;
    }

    function setTaskProgress() {
      if (!requireAuth()) return;
      const taskId = els.progressTaskInput.value;
      const progress = Math.max(0, Math.min(100, Number(els.progressValueInput.value) || 0));
      if (!taskId) {
        alert("진행도를 저장할 과제를 선택해주세요.");
        return;
      }
      tasks = mapTaskTree(tasks, taskId, (task) => ({ ...task, progress }));
      saveTasks();
      render();
    }

    function toggleTask(id) {
      if (!requireAuth()) return;
      const target = flattenTasks().find(task => task.id === id);
      if (!target) return;
      tasks = mapToggleTask(tasks, id, !target.done);
      saveTasks();
      render();
    }

    function deleteTask(id) {
      if (!requireAuth()) return;
      const target = flattenTasks().find(task => task.id === id);
      if (!target) return;
      const affectedIds = new Set(collectTaskIds(target));

      tasks = removeTaskTree(tasks, id);
      saveTasks();
      render();
    }

    function clearDoneTasks() {
      if (!requireAuth()) return;
      const doneCount = flattenTasks().filter(task => task.done).length;
      if (!doneCount) return;
      if (!confirm(`완료된 ${doneCount}개 과제를 삭제할까요?`)) return;
      tasks = clearDoneTaskTree(tasks);
      saveTasks();
      render();
    }

    function getFilteredTasks() {
      const query = els.searchInput.value.trim().toLowerCase();
      const status = els.statusFilter.value;
      const sortBy = els.sortBy.value;
      const courseFilter = els.courseFilter ? els.courseFilter.value : "all";

      const filtered = filterTaskTree(tasks, (task) => {
        const matchesQuery = !query ||
          task.title.toLowerCase().includes(query) ||
          task.course.toLowerCase().includes(query) ||
          task.note.toLowerCase().includes(query);
        const matchesStatus =
          status === "all" ||
          (status === "active" && !task.done) ||
          (status === "done" && task.done);
        const matchesCourse = courseFilter === "all" || task.course === courseFilter;
        return matchesQuery && matchesStatus && matchesCourse;
      });

      return sortTaskTree(filtered, sortBy);
    }

    function renderStudyTaskOptions() {
      if (!els.progressTaskInput) return;
      const previous = els.progressTaskInput.value;
      const flatTasks = flattenTasks();
      const options = ['<option value="">진행도 업데이트할 과제 선택</option>']
        .concat(flatTasks.map(task => {
          const prefix = "&nbsp;&nbsp;".repeat(task.depth);
          return `<option value="${task.id}">${prefix}${escapeHtml(task.titlePath.join(" > "))}</option>`;
        }));
      els.progressTaskInput.innerHTML = options.join("");
      if (previous && flatTasks.some(task => task.id === previous)) {
        els.progressTaskInput.value = previous;
      }
    }

    function renderStudyLogs() {
      if (!els.progressList) return;
      const flatTasks = flattenTasks();
      els.progressList.innerHTML = "";
      if (!flatTasks.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "등록된 과제가 없습니다. 과제를 추가하면 진행도를 표시할 수 있어요.";
        els.progressList.appendChild(li);
        return;
      }

      for (const task of flatTasks.slice(0, 16)) {
        const progress = Math.max(0, Math.min(100, Number(task.progress) || 0));
        const li = document.createElement("li");
        li.className = "progress-item";
        li.innerHTML = `
          <div class="progress-ring" style="--pct:${progress}">${progress}%</div>
          <div class="progress-text">
            <strong>${escapeHtml(task.titlePath.join(" > "))}</strong>
            <span>${escapeHtml(task.course)}</span>
          </div>
        `;
        els.progressList.appendChild(li);
      }
    }

    function openSubtaskForm(parentId) {
      activeSubtaskParentId = activeSubtaskParentId === parentId ? null : parentId;
      render();
    }

    function createSubtaskForm(task) {
      const wrapper = document.createElement("div");
      wrapper.className = "subtask-form";
      wrapper.innerHTML = SUBTASK_FORM_HTML;

      wrapper.querySelector('[data-field="course"]').value = task.course || "";
      wrapper.querySelector('[data-field="priority"]').value = task.priority || "medium";
      wrapper.querySelector('[data-action="cancel-subtask"]').addEventListener("click", () => {
        activeSubtaskParentId = null;
        render();
      });
      wrapper.querySelector('[data-action="save-subtask"]').addEventListener("click", () => {
        addSubtask(task.id, {
          title: wrapper.querySelector('[data-field="title"]').value,
          course: wrapper.querySelector('[data-field="course"]').value,
          dueDate: wrapper.querySelector('[data-field="dueDate"]').value,
          priority: wrapper.querySelector('[data-field="priority"]').value,
          note: wrapper.querySelector('[data-field="note"]').value
        });
      });

      return wrapper;
    }

    function renderTaskNode(task, depth = 0) {
      const li = document.createElement("li");
      li.className = `task${task.done ? " done" : ""}`;
      li.innerHTML = `
        <input type="checkbox" aria-label="완료 체크" ${task.done ? "checked" : ""}>
        <div class="task-main">
          <p class="task-title">${escapeHtml(task.title)}</p>
          <div class="task-meta">
            <span class="tag">${escapeHtml(task.course)}</span>
            <span class="tag ${task.priority}">우선순위 ${PRIORITY_LABEL[task.priority]}</span>
            <span class="tag">${formatDue(task.dueDate)}</span>
            <span class="tag">${dueBadge(task)}</span>
            ${depth ? `<span class="tag">세부 ${depth}단계</span>` : ""}
          </div>
          ${task.note ? `<p class="task-note">메모: ${escapeHtml(task.note)}</p>` : ""}
        </div>
        <div class="task-actions">
          <button class="ghost" type="button">${task.done ? "되돌리기" : "완료"}</button>
          <button class="ghost" type="button">세부 과제 추가</button>
          <button class="danger" type="button">삭제</button>
        </div>
      `;

      const checkbox = li.querySelector("input[type='checkbox']");
      const buttons = li.querySelectorAll(".task-actions button");
      checkbox.addEventListener("change", () => toggleTask(task.id));
      buttons[0].addEventListener("click", () => toggleTask(task.id));
      buttons[1].addEventListener("click", () => openSubtaskForm(task.id));
      buttons[2].addEventListener("click", () => deleteTask(task.id));

      const childWrap = document.createElement("div");
      childWrap.className = "task-children";

      if (activeSubtaskParentId === task.id) {
        childWrap.appendChild(createSubtaskForm(task));
      }

      if (task.subtasks?.length) {
        const childList = document.createElement("ul");
        childList.className = "subtask-list";
        for (const child of task.subtasks) {
          childList.appendChild(renderTaskNode(child, depth + 1));
        }
        childWrap.appendChild(childList);
      }

      if (childWrap.childNodes.length) {
        li.appendChild(childWrap);
      }

      return li;
    }

    function renderCourseCategorySelects() {
      if (!els.courseCategorySelect || !els.courseFilter) return;
      const prevForm = els.courseCategorySelect.value;
      const prevFilter = els.courseFilter.value;

      els.courseCategorySelect.innerHTML = [
        '<option value="">수업을 선택하세요</option>',
        ...courseCategories.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
      ].join("");

      els.courseFilter.innerHTML = [
        '<option value="all">수업: 전체</option>',
        ...courseCategories.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
      ].join("");

      if (prevForm && [...els.courseCategorySelect.options].some(o => o.value === prevForm)) {
        els.courseCategorySelect.value = prevForm;
      }
      if (prevFilter && [...els.courseFilter.options].some(o => o.value === prevFilter)) {
        els.courseFilter.value = prevFilter;
      } else {
        els.courseFilter.value = "all";
      }
    }

    function render() {
      renderCourseCategorySelects();
      const view = getFilteredTasks();
      const visibleCount = countTaskTree(view);
      els.taskList.innerHTML = "";

      if (!view.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = flattenTasks().length
          ? "필터 조건에 맞는 과제가 없습니다."
          : "아직 등록된 과제가 없습니다. 첫 과제를 추가해보세요.";
        els.taskList.appendChild(li);
      } else {
        for (const task of view) {
          els.taskList.appendChild(renderTaskNode(task));
        }
      }

      renderStudyTaskOptions();
      renderStudyLogs();
      renderUrgentDueSummary();
      els.countText.textContent = `${visibleCount}개 표시`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[c]);
    }

    function signUpWithEmail() {}
    function signInWithEmail() {}
    function signInWithGoogle() {}
    function signOutUser() {}

    function initLocalState() {
      currentUid = "local";
      activeSubtaskParentId = null;
      tasks = loadTasks();
      courseCategories = loadCourseCategories();
      migrateCourseCategoriesIfEmpty();
      updateAppInteractivity();
      clearStudyLogInputs();
      setAuthMessage("로컬 저장 모드입니다. 브라우저 새로고침 후에도 데이터가 유지됩니다.");
      render();
    }

    initLocalState();
    switchAppTab("add");
    if (els.tabAddBtn) els.tabAddBtn.addEventListener("click", () => switchAppTab("add"));
    if (els.tabListBtn) els.tabListBtn.addEventListener("click", () => switchAppTab("list"));
    els.addBtn.addEventListener("click", addTask);
    els.clearDoneBtn.addEventListener("click", clearDoneTasks);
    if (els.addCourseCategoryBtn) els.addCourseCategoryBtn.addEventListener("click", addCourseCategory);
    if (els.removeCourseCategoryBtn) els.removeCourseCategoryBtn.addEventListener("click", removeSelectedCourseCategory);
    if (els.newCourseCategoryInput) {
      els.newCourseCategoryInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addCourseCategory();
        }
      });
    }
    els.searchInput.addEventListener("input", render);
    if (els.courseFilter) els.courseFilter.addEventListener("change", render);
    els.statusFilter.addEventListener("change", render);
    els.sortBy.addEventListener("change", render);
    if (els.progressValueInput && els.progressValueLabel) {
      els.progressValueInput.addEventListener("input", () => {
        els.progressValueLabel.textContent = `${els.progressValueInput.value}%`;
      });
    }
    if (els.progressTaskInput && els.progressValueInput && els.progressValueLabel) {
      els.progressTaskInput.addEventListener("change", () => {
        const selected = flattenTasks().find(task => task.id === els.progressTaskInput.value);
        const progress = selected ? (Number(selected.progress) || 0) : 0;
        els.progressValueInput.value = String(progress);
        els.progressValueLabel.textContent = `${progress}%`;
      });
    }
    if (els.saveProgressBtn) els.saveProgressBtn.addEventListener("click", setTaskProgress);
    if (els.loginBtn) els.loginBtn.addEventListener("click", signInWithEmail);
    if (els.signupBtn) els.signupBtn.addEventListener("click", signUpWithEmail);
    if (els.googleLoginBtn) els.googleLoginBtn.addEventListener("click", signInWithGoogle);
    if (els.logoutBtn) els.logoutBtn.addEventListener("click", signOutUser);
    els.titleInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    clearStudyLogInputs();
    updateAppInteractivity();
    render();
  </script>
</body>
</html>
